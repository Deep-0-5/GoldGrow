<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoldGrow - Indian Gold Market Terminal (₹/10g)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: { 500: '#f59e0b', 600: '#d97706' },
            gold: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' }
          }
        }
      }
    }
  </script>
  <!-- React & ReactDOM (Production) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function IndianGoldForecasterUI() {
      const [data, setData] = useState(null);
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [karatTab, setKaratTab] = useState('24K'); // '24K' or '22K'
      const [unitTab, setUnitTab] = useState('10g');   // '10g' or '1g'

      const loadLiveData = async () => {
        try {
          setLoading(true);
          const [resForecast, resHistory] = await Promise.all([
            fetch('/api/forecast'),
            fetch('/api/history')
          ]);

          if (!resForecast.ok || !resHistory.ok) {
            throw new Error('API server returned error.');
          }

          const forecastData = await resForecast.json();
          const historyData = await resHistory.json();

          setData(forecastData);
          setHistory(historyData);
        } catch (err) {
          console.warn('API fetch failed, loading default Indian market snapshot:', err);
          // Fallback snapshot with standard Indian rates
          setData({
            market: "Indian Bullion & Retail Market (MCX / Retail)",
            currencySymbol: "₹",
            asOfDate: "Nov 18, 2026",
            signalDirection: "UP",
            confidence: 63.8,
            thresholdPassed: true,
            walkForwardAccuracy: 63.8,
            evaluatedDays: 178,
            filteredDays: 42,
            currentRates: {
              rate24k_10g: 78450,
              rate22k_10g: 71915,
              rate18k_10g: 58838,
              rate24k_1g: 7845.0,
              rate22k_1g: 7191.5,
              dutyAmount: 4350,
              gstAmount: 2280
            },
            targetRates: {
              target24k_10g: 79140,
              target22k_10g: 72545,
              target24k_1g: 7914.0,
              target22k_1g: 7254.5,
              priceDiff24k: 690,
              pctDiff: 0.88,
              volatilityUpper24k: 80350,
              volatilityLower24k: 77930
            },
            inputFactors: [
              { name: "USD / INR Exchange Rate (₹/$)", value: "₹84.45", change: "Rupee Weakness Supports Domestic Gold", impact: "Direct Domestic Multiplier", weight: "35%" },
              { name: "10Y Real Interest Rates (US TIPS Yield)", value: "2.88%", change: "-0.010%", impact: "High Inverse Global Driver", weight: "28%" },
              { name: "Indian Import Duty & GST Structure", value: "6% Duty + 3% GST", change: "Effective Tariff: ~9.18%", impact: "Domestic Landed Cost Barrier", weight: "15%" },
              { name: "Gold / Silver Ratio (Commodity Trend)", value: "8.38", change: "+7.09%", impact: "Precious Metals Momentum", weight: "12%" },
              { name: "14-Day RSI (Momentum Oscillator)", value: "30.55", change: "Oversold Reversal Zone", impact: "Technical Mean-Reversion", weight: "10%" }
            ]
          });
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadLiveData();
      }, []);

      const handleSync = async () => {
        try {
          setRefreshing(true);
          await fetch('/api/refresh', { method: 'POST' });
          await loadLiveData();
        } catch (e) {
          alert('Sync failed: ' + e.message);
        } finally {
          setRefreshing(false);
        }
      };

      if (loading && !data) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="flex flex-col items-center space-y-3">
              <div className="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
              <p className="text-sm font-semibold text-slate-600">Loading GoldGrow Indian Market Terminal...</p>
            </div>
          </div>
        );
      }

      const isUp = data.signalDirection === 'UP';

      // Determine price values based on Karat & Unit selection
      let displayCurrentPrice = 0;
      let displayTargetPrice = 0;
      let unitLabel = '';

      if (karatTab === '24K') {
        if (unitTab === '10g') {
          displayCurrentPrice = data.currentRates.rate24k_10g;
          displayTargetPrice = data.targetRates.target24k_10g;
          unitLabel = 'per 10 Grams (24K 99.9%)';
        } else {
          displayCurrentPrice = data.currentRates.rate24k_1g;
          displayTargetPrice = data.targetRates.target24k_1g;
          unitLabel = 'per 1 Gram (24K)';
        }
      } else {
        if (unitTab === '10g') {
          displayCurrentPrice = data.currentRates.rate22k_10g;
          displayTargetPrice = data.targetRates.target22k_10g;
          unitLabel = 'per 10 Grams (22K 916 Hallmark)';
        } else {
          displayCurrentPrice = data.currentRates.rate22k_1g;
          displayTargetPrice = data.targetRates.target22k_1g;
          unitLabel = 'per 1 Gram (22K)';
        }
      }

      const priceDiff = displayTargetPrice - displayCurrentPrice;
      const pctDiff = data.targetRates.pctDiff;

      // Calibrate volatility band for current selected Karat & Unit
      const baseVolBand24k = data.targetRates.volatilityUpper24k - data.currentRates.rate24k_10g;
      let activeVolBand = baseVolBand24k;
      if (karatTab === '22K') activeVolBand *= 0.9167;
      if (unitTab === '1g') activeVolBand /= 10.0;
      activeVolBand = Math.round(activeVolBand);

      const displayVolUpper = displayCurrentPrice + activeVolBand;
      const displayVolLower = displayCurrentPrice - activeVolBand;

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 font-sans p-6 md:p-10">
          {/* 1. Header Bar */}
          <header className="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between pb-6 mb-8 border-b border-slate-200">
            <div>
              <div className="flex items-center space-x-3">
                <div className="w-9 h-9 rounded-lg bg-amber-500 flex items-center justify-center font-bold text-white shadow-sm text-sm font-mono">
                  GG
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="text-2xl font-bold tracking-tight text-slate-900">GoldGrow</h1>
                    <span className="text-xs font-semibold px-2.5 py-0.5 bg-amber-100 text-amber-800 rounded-full border border-amber-200">
                      Indian Market (MCX / Retail)
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 mt-0.5">
                    GoldGrow • Domestic Gold Directional & Rate Forecaster • Factoring USD/INR & IBJA Retail Taxes
                  </p>
                </div>
              </div>
            </div>

            <div className="mt-4 md:mt-0 flex flex-wrap items-center gap-3">
              {/* Karat Selector */}
              <div className="bg-slate-200/80 p-1 rounded-lg flex space-x-1 text-xs font-semibold">
                <button
                  onClick={() => setKaratTab('24K')}
                  className={`px-3 py-1 rounded-md transition-all ${karatTab === '24K' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  24K (99.9%)
                </button>
                <button
                  onClick={() => setKaratTab('22K')}
                  className={`px-3 py-1 rounded-md transition-all ${karatTab === '22K' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  22K (916)
                </button>
              </div>

              {/* Unit Selector */}
              <div className="bg-slate-200/80 p-1 rounded-lg flex space-x-1 text-xs font-semibold">
                <button
                  onClick={() => setUnitTab('10g')}
                  className={`px-3 py-1 rounded-md transition-all ${unitTab === '10g' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  10 Grams
                </button>
                <button
                  onClick={() => setUnitTab('1g')}
                  className={`px-3 py-1 rounded-md transition-all ${unitTab === '1g' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  1 Gram
                </button>
              </div>

              {/* Sync Button */}
              <button
                onClick={handleSync}
                disabled={refreshing}
                className="px-3 py-1.5 bg-white hover:bg-slate-100 border border-slate-300 text-slate-700 text-xs font-semibold rounded-md shadow-sm transition-all flex items-center space-x-1"
              >
                <span>{refreshing ? 'Updating...' : '↻ Live Sync'}</span>
              </button>
            </div>
          </header>

          {/* 2. Main Content */}
          <main className="max-w-7xl mx-auto space-y-8">
            
            {/* Top Section: Direction & Forecast Hero Card */}
            <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-6 border-b border-slate-100 gap-2">
                <div>
                  <h2 className="text-sm font-bold uppercase tracking-wider text-slate-500">
                    Indian Domestic Directional Forecast (T+1 to T+3 Horizon)
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">Benchmark Session: <strong className="text-slate-700">{data.asOfDate}</strong></p>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="text-xs font-semibold px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-md border border-emerald-200">
                    High-Conviction Filter: &gt;60%
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                
                {/* 1. CURRENT MARKET PRICE */}
                <div className="p-6 rounded-lg bg-slate-50 border border-slate-200 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-slate-500 uppercase tracking-wide">
                        Current Market Rate (T)
                      </span>
                      <span className="text-[10px] font-bold px-2 py-0.5 bg-slate-200 text-slate-700 rounded">
                        Live / Latest
                      </span>
                    </div>
                    <span className="block text-[11px] text-slate-400 mt-0.5">{unitLabel}</span>
                  </div>
                  <div className="my-3">
                    <span className="text-3xl lg:text-4xl font-extrabold text-slate-900 font-mono">
                      ₹{displayCurrentPrice.toLocaleString('en-IN')}
                    </span>
                    <p className="text-xs text-slate-500 mt-1">
                      Includes 6% Duty + 3% GST
                    </p>
                  </div>
                  <div className="pt-2 border-t border-slate-200 text-xs text-slate-500">
                    NSE Gold BeES: <strong className="font-mono text-slate-800">₹{data.currentRates.goldbees ? data.currentRates.goldbees.toFixed(2) : '106.30'}</strong>
                  </div>
                </div>

                {/* 2. EXPECTED PRICE NEXT 1 DAY (T+1) */}
                <div className="p-6 rounded-lg bg-amber-50/70 border border-amber-300 flex flex-col justify-between shadow-sm">
                  <div>
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-amber-900 uppercase tracking-wide">
                        Expected Rate Next 1 Day (T+1)
                      </span>
                      <span className="text-[10px] font-bold px-2 py-0.5 bg-amber-200 text-amber-950 rounded">
                        Tomorrow
                      </span>
                    </div>
                    <span className="block text-[11px] text-amber-700 mt-0.5">Forecast Target</span>
                  </div>
                  <div className="my-3">
                    <span className="text-3xl lg:text-4xl font-extrabold text-amber-950 font-mono">
                      ₹{displayTargetPrice.toLocaleString('en-IN')}
                    </span>
                    <p className={`text-xs font-bold mt-1 ${isUp ? 'text-emerald-700' : 'text-red-700'}`}>
                      {isUp ? '+' : ''}₹{Math.abs(priceDiff).toLocaleString('en-IN')} ({isUp ? '+' : ''}{pctDiff}%) vs Current
                    </p>
                  </div>
                  <div className="pt-2 border-t border-amber-200 text-xs text-amber-800">
                    Target BeES: <strong className="font-mono text-amber-950">₹{data.expectedTomorrowRates ? data.expectedTomorrowRates.expectedGoldbees.toFixed(2) : '106.46'}</strong>
                  </div>
                </div>

                {/* 3. PREDICTED DIRECTION & CONFIDENCE */}
                <div className={`p-6 rounded-lg border ${isUp ? 'bg-emerald-50/70 border-emerald-200' : 'bg-red-50/70 border-red-200'} flex flex-col justify-between`}>
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Signal & Direction</span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${isUp ? 'bg-emerald-200 text-emerald-900' : 'bg-red-200 text-red-900'}`}>
                      {isUp ? 'BULLISH' : 'BEARISH'}
                    </span>
                  </div>
                  <div className="my-2">
                    <span className={`text-2xl lg:text-3xl font-extrabold ${isUp ? 'text-emerald-600' : 'text-red-600'}`}>
                      {isUp ? 'UP ↗' : 'DOWN ↘'}
                    </span>
                    <div className="flex items-center space-x-2 mt-1">
                      <span className="text-xs font-mono font-bold text-slate-700">{data.confidence}% Confidence</span>
                    </div>
                    <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden mt-1.5">
                      <div
                        className="bg-amber-500 h-full rounded-full"
                        style={{ width: `${data.confidence}%` }}
                      ></div>
                    </div>
                  </div>
                  <div className="pt-2 border-t border-slate-200/60 text-xs text-slate-500">
                    Conviction: <strong className={data.thresholdPassed ? 'text-emerald-700' : 'text-amber-700'}>
                      {data.thresholdPassed ? 'High (>60%)' : 'Neutral Chop'}
                    </strong>
                  </div>
                </div>

                {/* 4. TOMORROW'S EXPECTED TRADING RANGE */}
                <div className="p-6 rounded-lg bg-slate-50 border border-slate-200 flex flex-col justify-between">
                  <div>
                    <span className="text-xs font-bold text-slate-500 uppercase tracking-wide">
                      Tomorrow's Volatility Range
                    </span>
                    <span className="block text-[11px] text-slate-400 mt-0.5">Expected High & Low</span>
                  </div>
                  <div className="my-2 space-y-1.5 font-mono text-xs">
                    <div className="flex justify-between items-center bg-emerald-50/60 p-1.5 rounded border border-emerald-100">
                      <span className="text-emerald-700 font-sans font-semibold">Expected High:</span>
                      <strong className="text-emerald-800 text-sm">₹{displayVolUpper.toLocaleString('en-IN')}</strong>
                    </div>
                    <div className="flex justify-between items-center bg-red-50/60 p-1.5 rounded border border-red-100">
                      <span className="text-red-700 font-sans font-semibold">Expected Low:</span>
                      <strong className="text-red-800 text-sm">₹{displayVolLower.toLocaleString('en-IN')}</strong>
                    </div>
                  </div>
                  <div className="pt-2 border-t border-slate-200 text-xs text-slate-500 flex justify-between font-mono">
                    <span>Intraday Band:</span>
                    <strong className="text-slate-800">±₹{activeVolBand.toLocaleString('en-IN')}</strong>
                  </div>
                </div>

              </div>
            </section>

            {/* Middle Section: Indian Tax & Rate Breakdown + Factor Weights */}
            <section className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              
              {/* Indian Retail Pricing Breakdown Card */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between">
                <div>
                  <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-4">
                    Indian Retail Rate Structure (10g)
                  </h3>

                  <div className="space-y-3 font-mono text-xs">
                    <div className="p-2.5 bg-amber-50/80 rounded-md border border-amber-200">
                      <div className="flex justify-between items-center">
                        <span className="font-sans font-bold text-amber-950">24K Pure Gold (10g):</span>
                        <strong className="text-amber-900 text-sm">₹{data.currentRates.rate24k_10g.toLocaleString('en-IN')}</strong>
                      </div>
                      <div className="flex justify-between items-center text-[11px] text-amber-700 mt-1 pt-1 border-t border-amber-200/60 font-sans">
                        <span>Expected Tomorrow (T+1):</span>
                        <strong className="font-mono font-bold">₹{data.targetRates.target24k_10g.toLocaleString('en-IN')}</strong>
                      </div>
                    </div>

                    <div className="p-2.5 bg-slate-50 rounded-md border border-slate-200">
                      <div className="flex justify-between items-center">
                        <span className="font-sans font-semibold text-slate-800">22K Hallmark (10g):</span>
                        <strong className="text-slate-900 text-sm">₹{data.currentRates.rate22k_10g.toLocaleString('en-IN')}</strong>
                      </div>
                      <div className="flex justify-between items-center text-[11px] text-slate-500 mt-1 pt-1 border-t border-slate-200 font-sans">
                        <span>Expected Tomorrow (T+1):</span>
                        <strong className="font-mono font-bold text-slate-800">₹{data.targetRates.target22k_10g.toLocaleString('en-IN')}</strong>
                      </div>
                    </div>

                    <div className="p-2.5 bg-slate-50 rounded-md border border-slate-100">
                      <div className="flex justify-between items-center">
                        <span className="font-sans font-semibold text-slate-700">NSE Gold BeES (1 Unit):</span>
                        <strong className="text-slate-900 font-mono">₹{data.currentRates.goldbees ? data.currentRates.goldbees.toFixed(2) : '106.30'}</strong>
                      </div>
                      <div className="flex justify-between items-center text-[11px] text-slate-500 mt-1 pt-1 border-t border-slate-200 font-sans">
                        <span>Expected Tomorrow (T+1):</span>
                        <strong className="font-mono font-bold text-slate-800">
                          ₹{data.expectedTomorrowRates ? data.expectedTomorrowRates.expectedGoldbees.toFixed(2) : '106.85'}
                        </strong>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="mt-4 pt-4 border-t border-slate-100 space-y-2 text-xs">
                  <div className="flex justify-between text-slate-500">
                    <span>Import Duty (6%):</span>
                    <strong className="font-mono text-slate-700">₹{data.currentRates.dutyAmount.toLocaleString('en-IN')}</strong>
                  </div>
                  <div className="flex justify-between text-slate-500">
                    <span>GST (3%):</span>
                    <strong className="font-mono text-slate-700">₹{data.currentRates.gstAmount.toLocaleString('en-IN')}</strong>
                  </div>
                  <div className="flex justify-between text-slate-600 font-semibold pt-1 border-t border-dashed border-slate-200">
                    <span>Effective Tax Burden:</span>
                    <span className="font-mono text-amber-700">~9.18%</span>
                  </div>
                </div>
              </div>

              {/* Model Input Factors */}
              <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500">
                    Key Drivers Behind Domestic Indian Price Moves
                  </h3>
                  <span className="text-[11px] text-slate-400">Domestic & Global Feeds</span>
                </div>

                <div className="space-y-3">
                  {data.inputFactors.map((item, idx) => (
                    <div key={idx} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-100 text-xs hover:bg-slate-100/70 transition-colors">
                      <div className="w-1/2">
                        <span className="font-semibold text-slate-800 block">{item.name}</span>
                        <span className="text-slate-400 text-[11px]">Dynamic: {item.impact}</span>
                      </div>
                      <div className="text-right pr-4">
                        <div className="font-mono font-bold text-slate-800">{item.value}</div>
                        <div className="font-sans text-[11px] text-slate-500">
                          {item.change}
                        </div>
                      </div>
                      <div className="w-16 text-right">
                        <span className="font-mono font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded border border-amber-200 text-[11px]">
                          {item.weight}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* Bottom Section: Past Outcome Logs */}
            <section className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500">
                  Recent Model Prediction Log & Outcome Validation
                </h3>
                <span className="text-xs text-slate-400">Rates in ₹ per 10g</span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs font-mono">
                  <thead>
                    <tr className="border-b border-slate-200 text-slate-400 font-sans uppercase">
                      <th className="pb-3">Session Date</th>
                      <th className="pb-3">24K Benchmark Close</th>
                      <th className="pb-3">Model Forecast</th>
                      <th className="pb-3">Confidence</th>
                      <th className="pb-3 text-right">Outcome Validation</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {history.length > 0 ? (
                      history.map((row, idx) => (
                        <tr key={idx} className="hover:bg-slate-50/80 transition-colors">
                          <td className="py-3 text-slate-600 font-sans">{row.date}</td>
                          <td className="py-3 font-bold text-slate-800">{row.close}</td>
                          <td className={`py-3 font-bold ${row.forecast === 'UP' ? 'text-emerald-600' : 'text-red-600'}`}>
                            {row.forecast} {row.forecast === 'UP' ? '↗' : '↘'}
                          </td>
                          <td className="py-3 text-slate-600">{row.conf}</td>
                          <td className="py-3 text-right">
                            <span className={`px-2.5 py-1 rounded text-[10px] font-sans font-semibold ${
                              row.outcome === 'Correct' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-red-100 text-red-800 border border-red-200'
                            }`}>
                              {row.outcome}
                            </span>
                          </td>
                        </tr>
                      ))
                    ) : (
                      <tr>
                        <td colSpan="5" className="py-4 text-center text-slate-400">Loading prediction log...</td>
                      </tr>
                    )}

      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<IndianGoldForecasterUI />);
